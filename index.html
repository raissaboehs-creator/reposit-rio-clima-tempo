<!DOCTYPE html>

<html lang="pt-br">

<head>
    <link rel="stylesheet" href="style.css"> <!--Link do CSS-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de clima</title>
</head>

<body>

<header>
    <h1>Consulta do Clima 🌸</h1> <!--Título da página.-->
</header>

<main>

    <article>
        <form>

            <label for="cidade">Digite uma cidade:</label> 

            <input type="text" id="cidade" placeholder="Exemplo: Lages"> <!--O que aparece no lugar para digitar a cidade.-->

            <button id="buscar" type="button">Buscar clima</button> <!--Botão para buscar.-->

            <p>Consulte uma cidade.</p> <!--Descrição do que o site faz.-->

        </form>
    </article>

    <section id="resultado">
        <!--O JavaScript vai colocar o resultado aqui.-->
    </section>

</main>

<script src="script.js"></script> <!--Link do JavaScript.-->

</body>

</html>
